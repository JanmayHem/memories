<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Memories</title>
  <style>
    :root { color-scheme: dark light; --bg: #111; --fg: #eee; --muted: #999; --accent: #e8b26a; }
    @media (prefers-color-scheme: light) { :root { --bg: #fafaf7; --fg: #1a1a1a; --muted: #666; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 0 16px; }
    main { max-width: 32rem; text-align: center; }
    h1 { font: 400 2.5rem/1.2 Georgia, "Times New Roman", serif; margin: 0 0 .5rem; }
    p { color: var(--muted); margin: 0 0 1.5rem; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Memories</h1>
    <p>Our private photo albums. The new gallery is on the way.</p>
    <p><a href="https://{{env "PHOTOS_HOST"}}/">Open the photo library</a></p>
  </main>
</body>
</html>
